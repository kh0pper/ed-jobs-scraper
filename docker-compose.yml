services:
  backend:
    build: ./backend
    container_name: edjobs_backend
    ports:
      - "100.118.41.122:8002:8000"
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m

  celery_worker:
    build: ./backend
    container_name: edjobs_celery_worker
    init: true
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "-t", "10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g

  celery_apply_worker:
    build: ./backend
    container_name: edjobs_celery_apply_worker
    init: true
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -Q apply
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./scripts:/app/scripts
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "-t", "10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 3g

  celery_beat:
    build: ./backend
    container_name: edjobs_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      celery_worker:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: edjobs_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - edjobs_redis_data:/data

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: edjobs_postgres
    environment:
      POSTGRES_DB: edjobs
      POSTGRES_USER: edjobs_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edjobs_secure_2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edjobs_user -d edjobs"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - edjobs_postgres_data:/var/lib/postgresql/data

  nominatim:
    image: mediagis/nominatim:5.3.3
    container_name: edjobs_nominatim
    # NOMINATIM_PASSWORD lives in the untracked, gitignored .env.nominatim (mode 600),
    # read by this service only (the shared .env goes to the app services).
    env_file: .env.nominatim
    # Shared with the crow R4 instance's GIS tools (read-only geocoding API).
    # 8088 is claimed by trilium in crow's port-allocation.md, hence 8089.
    # Loopback only (2026-11-21): the scraper stack runs on crow again and
    # geocodes via nominatim:8080 on the compose network; the 2026-07-26
    # tailnet binding for grackle's stack is gone.
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      PBF_URL: https://download.geofabrik.de/north-america/us/texas/texas-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us/texas/updates/
      IMPORT_STYLE: full
    volumes:
      # 5.3.3 runs PostgreSQL 16 on its own volume, imported fresh 2026-11-22; the
      # 4.4 volume (edjobs_nominatim_data) is kept for rollback.
      - edjobs_nominatim5_data:/var/lib/postgresql/16/main
    shm_size: 1g
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

volumes:
  edjobs_redis_data:
  edjobs_postgres_data:
  edjobs_nominatim_data:
  edjobs_nominatim5_data:
    external: true
